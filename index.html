<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPTesting - Modern Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        #game-canvas {
            background-color: #ffffff;
            cursor: crosshair;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .btn-primary {
            background-color: #3b82f6;
            color: white;
            transition: all 0.2s;
        }
        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .btn-primary:not(:disabled):hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }
        input {
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
        }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen" class="fixed inset-0 flex items-center justify-center z-50 bg-slate-100">
        <div class="glass-panel p-8 rounded-2xl max-w-md w-full mx-4">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">MPTesting</h1>
                <p class="text-slate-500 text-sm">Multiplayer Testing Environment</p>
            </div>
            
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Your Name</label>
                    <input type="text" id="username-input" class="w-full text-lg" placeholder="Enter username...">
                </div>

                <div class="pt-4 space-y-3">
                    <div class="flex flex-col gap-2">
                        <input type="text" id="lobby-input" class="w-full" placeholder="Lobby Name / ID">
                        <div class="grid grid-cols-2 gap-2">
                            <button id="join-btn" class="btn-primary py-2 px-4 rounded-lg font-medium">Join Lobby</button>
                            <button id="create-btn" class="btn-secondary py-2 px-4 rounded-lg font-medium">Create New</button>
                        </div>
                    </div>
                </div>

                <p id="status-msg" class="text-center text-sm font-medium min-h-[1.25rem]"></p>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-ui" class="hidden">
        <div class="fixed top-6 left-6 flex gap-4 z-20">
            <div class="glass-panel px-4 py-2 rounded-full text-sm font-medium flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                Lobby: <span id="display-lobby" class="text-blue-600">--</span>
            </div>
            <div class="glass-panel px-4 py-2 rounded-full text-sm font-medium">
                Online: <span id="display-count">1</span>
            </div>
        </div>

        <div class="fixed bottom-6 left-6 w-80 z-20 flex flex-col gap-2">
            <div id="chat-box" class="glass-panel h-64 rounded-xl overflow-y-auto p-4 text-sm flex flex-col-reverse gap-2"></div>
            <div class="relative">
                <input type="text" id="chat-input" class="w-full glass-panel border-none shadow-lg py-3 px-4 pr-12 rounded-xl" placeholder="Say something...">
            </div>
        </div>

        <div class="fixed bottom-6 right-6 glass-panel px-3 py-1 rounded-lg text-[10px] font-mono text-slate-400">
            LOC: <span id="display-pos">0, 0</span>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, serverTimestamp, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Constants
        const firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'mp-testing-v2';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State
        let user = null;
        let currentLobby = null;
        let players = {};
        const localPlayer = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            name: "User",
            color: `hsl(${Math.random() * 360}, 65%, 55%)`
        };
        const keys = {};

        // UI Refs
        const setupScreen = document.getElementById('setup-screen');
        const gameUI = document.getElementById('game-ui');
        const usernameInput = document.getElementById('username-input');
        const lobbyInput = document.getElementById('lobby-input');
        const joinBtn = document.getElementById('join-btn');
        const createBtn = document.getElementById('create-btn');
        const statusMsg = document.getElementById('status-msg');
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // Init Auth (MANDATORY RULE 3)
        async function initAuth() {
            try {
                if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                    await signInWithCustomToken(auth, window.__initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth error", e);
                statusMsg.innerText = "Auth Error: Check console";
            }
        }
        initAuth();

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (u) console.log("Authenticated as:", u.uid);
        });

        // Networking Logic
        async function startSession(lobbyName) {
            if (!user) {
                statusMsg.innerText = "Waiting for authentication...";
                return;
            }
            const name = usernameInput.value.trim();
            if (!name) {
                statusMsg.innerText = "Please enter a name";
                statusMsg.className = "text-center text-sm font-medium text-red-500";
                return;
            }
            if (!lobbyName) {
                statusMsg.innerText = "Please enter a lobby ID";
                statusMsg.className = "text-center text-sm font-medium text-red-500";
                return;
            }

            statusMsg.innerText = "Joining...";
            statusMsg.className = "text-center text-sm font-medium text-blue-500";

            currentLobby = lobbyName.toLowerCase().replace(/[^a-z0-9]/g, '_');
            localPlayer.name = name;

            try {
                // RULE 1 COMPLIANCE: /artifacts/{appId}/public/data/{collectionName}/{docId}
                // We merge the lobby ID into the collection name to keep the path length even (6 segments)
                const playerRef = doc(db, 'artifacts', appId, 'public', 'data', `lobby_${currentLobby}_players`, user.uid);
                
                await setDoc(playerRef, {
                    name: localPlayer.name,
                    x: localPlayer.x,
                    y: localPlayer.y,
                    color: localPlayer.color,
                    lastSeen: serverTimestamp()
                });

                // Listen for Players
                const playersCol = collection(db, 'artifacts', appId, 'public', 'data', `lobby_${currentLobby}_players`);
                onSnapshot(playersCol, (snapshot) => {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === "removed") delete players[change.doc.id];
                        else if (change.doc.id !== user.uid) players[change.doc.id] = change.doc.data();
                    });
                    document.getElementById('display-count').innerText = Object.keys(players).length + 1;
                }, (err) => {
                    statusMsg.innerText = "Connection Error. Retrying...";
                    console.error(err);
                });

                // Listen for Chat
                const chatCol = collection(db, 'artifacts', appId, 'public', 'data', `lobby_${currentLobby}_messages`);
                onSnapshot(chatCol, (snapshot) => {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === "added") addChatMessage(change.doc.data());
                    });
                }, (err) => console.error(err));

                setupScreen.classList.add('hidden');
                gameUI.classList.remove('hidden');
                document.getElementById('display-lobby').innerText = currentLobby;

                requestAnimationFrame(gameLoop);
                setInterval(syncPosition, 200);

            } catch (err) {
                statusMsg.innerText = "Error: " + err.message;
            }
        }

        async function syncPosition() {
            if (!user || !currentLobby) return;
            const playerRef = doc(db, 'artifacts', appId, 'public', 'data', `lobby_${currentLobby}_players`, user.uid);
            await setDoc(playerRef, {
                x: Math.round(localPlayer.x),
                y: Math.round(localPlayer.y),
                lastSeen: serverTimestamp()
            }, { merge: true });
        }

        async function sendChat() {
            const text = chatInput.value.trim();
            if (!text || !currentLobby || !user) return;
            chatInput.value = "";
            const chatCol = collection(db, 'artifacts', appId, 'public', 'data', `lobby_${currentLobby}_messages`);
            await addDoc(chatCol, { 
                sender: localPlayer.name, 
                text, 
                timestamp: serverTimestamp() 
            });
        }

        function addChatMessage(data) {
            const msgEl = document.createElement('div');
            msgEl.className = "animate-in fade-in slide-in-from-bottom-2 duration-300";
            msgEl.innerHTML = `
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">${data.sender}</span>
                    <span class="text-slate-700">${data.text}</span>
                </div>
            `;
            chatBox.prepend(msgEl);
        }

        // Engine
        function gameLoop() {
            const speed = 5;
            if (keys['ArrowUp'] || keys['KeyW']) localPlayer.y -= speed;
            if (keys['ArrowDown'] || keys['KeyS']) localPlayer.y += speed;
            if (keys['ArrowLeft'] || keys['KeyA']) localPlayer.x -= speed;
            if (keys['ArrowRight'] || keys['KeyD']) localPlayer.x += speed;

            localPlayer.x = Math.max(0, Math.min(canvas.width, localPlayer.x));
            localPlayer.y = Math.max(0, Math.min(canvas.height, localPlayer.y));
            document.getElementById('display-pos').innerText = `${Math.round(localPlayer.x)}, ${Math.round(localPlayer.y)}`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Grid
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=80) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=80) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            // Draw
            Object.values(players).forEach(p => drawPlayer(p.x, p.y, p.color, p.name, false));
            drawPlayer(localPlayer.x, localPlayer.y, localPlayer.color, localPlayer.name, true);

            requestAnimationFrame(gameLoop);
        }

        function drawPlayer(x, y, color, name, isLocal) {
            ctx.beginPath();
            ctx.ellipse(x, y + 12, 12, 5, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.05)";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x, y, 14, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            if (isLocal) {
                ctx.strokeStyle = "#3b82f6";
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.fillStyle = "#475569";
            ctx.font = "bold 11px Inter, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(name, x, y - 24);
        }

        // Events
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        chatInput.addEventListener('keypress', e => e.key === 'Enter' && sendChat());
        joinBtn.addEventListener('click', () => startSession(lobbyInput.value));
        createBtn.addEventListener('click', () => {
            const id = Math.random().toString(36).substring(2, 8);
            startSession(id);
        });

        window.addEventListener('beforeunload', () => {
            if (user && currentLobby) {
                const playerRef = doc(db, 'artifacts', appId, 'public', 'data', `lobby_${currentLobby}_players`, user.uid);
                deleteDoc(playerRef);
            }
        });

    </script>
</body>
</html>
